# Builds the Mac and Windows apps and publishes them as a GitHub Release.
# Installed copies of Password Vault check these releases and notify you of updates.
#
# Releasing an update is automatic:
#   1. Raise "version" in package.json (for example 1.2.0 -> 1.3.0).
#   2. Commit and push to main (GitHub Desktop: Commit to main -> Push origin).
# If that version hasn't been released yet, this builds and publishes it.
# Pushes that don't change the version number don't create a release.
# You can also start it by hand: Actions tab -> "Build and release" -> Run workflow.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

# If you push twice quickly, finish one release before starting the next.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Compare package.json version with existing releases
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "### Version $VERSION is already released — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "Raise \"version\" in package.json to publish an update." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "### Releasing version $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build and publish Windows app
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Mac app
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Password-Vault-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
